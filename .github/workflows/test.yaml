name: 🧪 Test

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    name: 🧪 Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.12.0
        with:
          cache: true
          sfw: true

      - name: 🧪 Run tests
        run: vp test --coverage

      - name: ⬆︎ Upload results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
